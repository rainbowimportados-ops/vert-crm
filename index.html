<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#AA6541" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>VERT CRM</title>
    <meta name="description" content="VERT CRM — atendimento de pacientes pelo WhatsApp." />
    <meta name="author" content="VERT" />
  </head>

  <body>
    <script>
      // Aplica o tema antes da primeira pintura (evita flash)
      try {
        var t = localStorage.getItem("vert-theme");
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
